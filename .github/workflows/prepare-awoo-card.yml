name: Prepare Awoo card asset

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-awoo-card.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create cropped Awoo card image and manifest links
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image

          source = Path('images/simulator/cruising.png')
          target = Path('images/awoo-card.png')
          target.parent.mkdir(parents=True, exist_ok=True)

          image = Image.open(source)
          image.crop((18, 47, 722, 551)).save(target, optimize=True)

          docs = Path('docs')
          docs.mkdir(parents=True, exist_ok=True)
          (docs / 'awoo.md').touch()

          manifest_path = Path('awoo.project.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['image'] = 'images/awoo-card.png'
          manifest['content'] = 'docs/awoo.md'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit generated Awoo assets
        run: |
          rm .github/workflows/prepare-awoo-card.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Awoo project card assets"
          git push
