name: FoxDash calibration pass 2 CI

on:
  push:
    branches:
      - telemetry-calibration-pass-2
  pull_request:
    branches:
      - telemetry-calibration-pass-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
