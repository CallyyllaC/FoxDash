name: FoxDash calibration pass 3 CI

on:
  push:
    branches:
      - telemetry-calibration-pass-3

jobs:
  test-and-simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Install offline calibration dependencies
        run: python -m pip install -r tools/calibration/requirements.txt
      - name: Run full unit suite
        run: python -m unittest discover -s tests -v
      - name: Run runtime replay simulator
        run: python tools/smoke/smoke_test_replay.py
      - name: Run calibrated replay and regime simulator
        run: python tools/smoke/smoke_test_calibrated_replay.py
      - name: Run LED mapping smoke test
        run: python tools/smoke/smoke_test_led_mapping.py
      - name: Run offline regime-training smoke test
        run: python tools/smoke/smoke_test_regime_training.py
